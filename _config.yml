# GitHub Pages(Jekyll) 게시 범위
# 웹 페이지(.html)와 페이지가 쓰는 이미지·데이터만 게시한다.
# 원고(.md)·스크립트·원천 데이터·작업 기록·설정 파일은 게시하지 않는다(저장소에는 그대로 남는다).
# JSON은 패턴("*.json")으로 빼면 include로 되살릴 수 없으므로(Jekyll), 게시하지 않을 JSON을 파일별로 적는다.
# 새 JSON·CSV 등을 커밋하면 게시할지 판단해 아래 exclude에 더한다.
exclude:
  - "*.md"
  - "*.py"
  - "*.pyc"
  - "*.ipynb"
  - "*.csv"
  - mcp_config.json
  - 01_재택의료_방문진료/지역별_시뮬레이션/all_regions_revalidated_summary.json
  - 01_재택의료_방문진료/지역별_시뮬레이션/revalidated_corpus_simulation.json
  - "*.pdf"
  - "*.zip"
  - "*.docx"
  - "*.xlsx"
  - "*.xls"
  - "*.hwp"
  - "*.hwpx"
  - "*.pptx"
  - "*.txt"
  - "*.bat"
  - "*.yml"
  - 04_CLI_대화세션_아카이브
  - 05_원천_통계_데이터셋
  - 06_분석_및_수집_스크립트
  - 07_MCP_및_API_인프라
  - 08_한의학교육_및_의료인력_정책/교육과정_혁신_자료
  - 08_한의학교육_및_의료인력_정책/법제_판례_직능
  - 08_한의학교육_및_의료인력_정책/인력수급_KCD_직역
  - 09_아카이브_서식_및_참고자료
